version: 1
groups:
  - annotation: Unfold settings
    options:
      - key: ckanext.unfold.max_file_size
        type: int
        default: 52428800 # 50MB in bytes
        validators: is_positive_integer
        description: |
          Maximum size of archives to process, in bytes. Prevents processing very large files.
          Generally, larger files take more time and resources to process.

      - key: ckanext.unfold.enable_cache
        type: bool
        default: true
        description: |
          Enable caching to improve performance on repeated access.
          Caching can significantly speed up access to frequently used resources.
          It is recommended to enable caching in production environments.
          Note, that caching uses Redis as backend, therefore it takes some memory.

      - key: ckanext.unfold.expand_nodes_threshold
        type: int
        default: 2000
        validators: is_positive_integer
        description: |
          Archives with at most this many entries are sent to the browser in one
          request and shown fully expanded. Larger archives are loaded folder by
          folder as the user opens them, and search runs on the server. Keep this
          in the low thousands: every entry above it becomes a DOM node at once.
          Must be at least 1.

      - key: ckanext.unfold.page_size
        type: int
        default: 500
        validators: is_positive_integer
        description: |
          For archives above the expand threshold, how many entries of one
          folder are sent per request. A folder with more children shows a
          "Show more" row that loads the next page.

      - key: ckanext.unfold.show_context_menu_default
        type: bool
        default: true
        description: |
          If true, the right click context menu will be enabled by default in the tree view.
          It offers Expand/Collapse for folders and Copy path for every entry; entries
          that carry a link (only set by custom adapters) also get Open URL and Copy URL.
          If false, there is no menu, and an entry that carries a link is opened by
          left clicking on it.

      - key: ckanext.unfold.request_timeout
        type: int
        default: 60
        validators: is_positive_integer
        description: |
          Per-request HTTP timeout, in seconds, used for every request made while
          fetching a remote resource (connect and read).

      - key: ckanext.unfold.build_in_background
        type: bool
        default: true
        description: |
          Read an archive that is not cached yet in a CKAN background job
          (`ckan jobs worker`) instead of inside the web request that asked for
          it. The widget shows a "processing" notice and polls until the listing
          is ready, so a slow origin or a large archive never ties up a web
          worker. Needs `ckanext.unfold.enable_cache`, since the job hands the
          result over through the cache. If no job worker is running the
          archive is read inside the request, as if this were off. In that case
          keep `ckanext.unfold.request_timeout` below your web server's
          request limit (uWSGI harakiri, gunicorn timeout).

      - key: ckanext.unfold.job_timeout
        type: int
        default: 600
        validators: is_positive_integer
        description: |
          Maximum time, in seconds, a background job may spend reading one
          archive before it is stopped and the widget shows an error. Only used
          when `ckanext.unfold.build_in_background` is on. This replaces
          `ckan.jobs.timeout` for Unfold's jobs, so it can be raised for slow
          origins without affecting other extensions.

      - key: ckanext.unfold.cache_ttl
        type: int
        default: 86400 # 24 hours
        validators: is_positive_integer
        description: |
          How long, in seconds, a resource's archive index stays cached in Redis
          before it is rebuilt on the next view. Only used when caching is enabled.

      - key: ckanext.unfold.zip_tail_block_size
        type: int
        default: 262144 # 256KB
        validators: is_positive_integer
        description: |
          Size, in bytes, of the suffix Range request used to probe a remote zip
          archive for its central directory. Larger values mean fewer follow-up
          requests for archives with a large directory, at the cost of
          transferring more than necessary for small ones.

      - key: ckanext.unfold.max_entries
        type: int
        default: 200000
        validators: is_positive_integer
        description: |
          Maximum number of entries read from one archive. Archives with more
          entries than this are truncated; the rest are not shown. Protects
          against an archive with an enormous number of tiny entries turning
          into millions of DOM nodes and a multi-hundred-megabyte cache entry.
          Kept well above the 65,535-entry ZIP64 threshold so large but
          legitimate archives are not truncated.

      - key: ckanext.unfold.max_decompressed_size
        type: int
        default: 524288000 # 500MB
        validators: is_positive_integer
        description: |
          Maximum decompressed size, in bytes, allowed while reading a compressed
          tar archive (.tar.gz, .tar.xz, .tar.bz2). Protects against a small
          compressed file that decompresses to a huge size, costing minutes of
          web worker CPU time (a "decompression bomb").
